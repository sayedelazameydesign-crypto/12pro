name: ✨ Feature Request
description: Propose a new capability for AGI-OS
title: "[FEAT] "
labels: ["enhancement", "needs-rfc"]
body:
  - type: input
    id: component
    attributes:
      label: Target Layer
      description: Which of the 12 layers does this belong to?
      placeholder: e.g. 2.Tests, 4.GitHub Automation, packages/planner
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Technical proposal, API sketch, architecture impact
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
  - type: dropdown
    id: gate-impact
    attributes:
      label: Certification Gate Impact
      description: Will this require a new gate or update existing gates?
      options: ["No gate change", "Update existing gate", "New gate required", "Breaking change"]
    validations:
      required: true
  - type: textarea
    id: adr
    attributes:
      label: ADR / RFC Link
      description: Link to docs/adr or docs/rfc if already drafted
