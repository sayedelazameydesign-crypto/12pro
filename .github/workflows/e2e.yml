name: E2E - Browser / API / Long-Horizon

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agi_os_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      # The dev server is started by playwright.config.ts (webServer), not here.
      # Starting it in this step too meant playwright - which uses
      # reuseExistingServer:false under CI - tried to bind an occupied :3000
      # and failed every run.
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agi_os_test
          REDIS_URL: redis://localhost:6379
      - name: Run E2E
        # playwright has no --output-file flag; the json reporter's outputFile
        # is configured in playwright.config.ts. Passing it made the CLI exit 1
        # before running a single test, and '|| echo {"status":"PASS"}' then
        # wrote a fake passing report over the top.
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            certification/reports/e2e.json
            playwright-report/
            test-results/

  e2e-long-horizon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx vitest run tests/acceptance --reporter=json --outputFile=certification/reports/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-report
          path: certification/reports/acceptance.json
