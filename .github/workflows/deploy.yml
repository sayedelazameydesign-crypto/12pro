name: Deploy - Staging / Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
        default: staging

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          node scripts/build/deploy.js --env staging --commit ${{ github.sha }}
      - name: Smoke tests
        run: npx vitest run tests/acceptance --env staging

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci && npm run build
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          node scripts/build/deploy.js --env production --commit ${{ github.sha }} --tag ${{ github.ref_name }}
      - name: Health check
        run: node scripts/verification/health-check.js --env production
