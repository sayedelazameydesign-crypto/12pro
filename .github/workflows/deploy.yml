name: Deploy - Staging / Production

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Deploy to staging
        run: |
          echo "Deploying to staging..."
          node scripts/build/deploy.js --env staging --commit ${{ github.sha }}
      - name: Smoke tests
        # Was `npx vitest run tests/acceptance --env staging`. `--env` selects a vitest
        # ENVIRONMENT (node/jsdom/happy-dom), not a deployment target, so vitest rejected
        # the unknown option and the step failed outright. This workflow only triggers on
        # pushes to main and on tags, which is why the breakage was never observed on a
        # branch run. The target is now passed as an environment variable.
        env:
          DEPLOY_ENV: staging
        run: npx vitest run tests/acceptance

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.environment == 'production'
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          node scripts/build/deploy.js --env production --commit ${{ github.sha }} --tag ${{ github.ref_name }}
      - name: Health check
        run: node scripts/verification/health-check.js --env production
