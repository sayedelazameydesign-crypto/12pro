name: CI - Build / Lint / Typecheck / Unit

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  unit-test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run test:unit -- --reporter=json --outputFile=certification/reports/unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-report
          path: certification/reports/unit.json

  build:
    needs: [lint, typecheck, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-dist
          path: |
            dist/
            packages/*/dist
            apps/*/dist

  # Gate verification is NOT done here.
  #
  # The previous `certification-gate-G0-G3` job ran verify-gates.js against the gate
  # files committed in the repository and swallowed the result with `|| echo`. Those
  # committed files were bound to an older commit, so the check was comparing the
  # wrong thing and could never fail.
  #
  # Certification is produced and verified in one place only:
  #   .github/workflows/certification.yml
  # It generates every gate from real runs against ${{ github.sha }}, binds them, and
  # fails on any mismatch.
