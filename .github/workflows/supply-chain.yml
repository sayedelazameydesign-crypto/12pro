name: Supply Chain - SBOM / Provenance / Policy (2026)

on:
  push:
    branches: [main, develop, 'arena/**']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 4 * * 1' # weekly
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  id-token: write
  attestations: write

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM (SPDX)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: certification/sbom/sbom.spdx.json
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: cyclonedx-json
          output-file: certification/sbom/sbom.cyclonedx.json
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: sbom-reports
          path: certification/sbom/

  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # No job-level continue-on-error. Tolerance belongs on the single third-party step
    # that may legitimately be unavailable (it needs pull-requests: write and does not
    # work on forks); a job-level flag would also have swallowed a failure in any other
    # step added here later.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: low
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause
          comment-summary-in-pr: never

  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx license-checker --production --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause" --summary
      - run: node scripts/supply-chain/license-check.js

  provenance-check:
    runs-on: ubuntu-latest
    # Was `continue-on-error: true` at job level, which discarded whatever
    # verify-provenance.js concluded. The script itself now distinguishes FAIL from
    # NOT_VERIFIED, so the job can be blocking without asserting something untrue.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Check release-level provenance
        # --scope=release: this workflow runs in parallel with certification.yml, which
        # is the only producer of the attestation record. Requiring that record here
        # would make this job depend on another workflow's output. Absence of a release
        # is reported as NOT_VERIFIED, which is not a pass.
        run: node scripts/supply-chain/verify-provenance.js --scope=release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce repository policies
        run: node scripts/supply-chain/policy-check.js --strict
