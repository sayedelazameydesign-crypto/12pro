name: Attestations - Build Provenance & SBOM (2026 Supply Chain)

on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  packages: write
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Build Docker image
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar

  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json
          output-file: certification/sbom/sbom.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: certification/sbom/sbom.spdx.json
      - name: Upload SBOM to Dependency Graph
        uses: anchore/sbom-action@v0
        with:
          path: certification/sbom/sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

  provenance:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sbom
          path: certification/sbom/
      - name: Build artifacts for attestation
        run: |
          mkdir -p dist
          tar -czf dist/agi-system-${{ github.sha }}.tar.gz packages/ apps/ services/ --exclude=node_modules || true
          echo "Built tarball"
      - name: Attest Build Provenance - Artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.tar.gz'
          subject-name: 'agi-system-artifact'
      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-path: 'dist/*.tar.gz'
          sbom-path: 'certification/sbom/sbom.spdx.json'
      - name: Attest Docker Image (if pushed)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "Docker attestation would happen on push with build-push-action + provenance"
      - uses: actions/upload-artifact@v4
        with:
          name: attestations
          path: |
            dist/*.tar.gz
            certification/sbom/

  verify-attestation:
    needs: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify attestations exist
        run: |
          echo "Verifying artifact attestations..."
          node scripts/attestation/verify.js --commit ${{ github.sha }}
      - name: Generate attestation report
        run: node scripts/attestation/generate.js --commit ${{ github.sha }} --output certification/attestations/${{ github.sha }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: attestation-report
          path: certification/attestations/
