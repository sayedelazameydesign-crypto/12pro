name: Governance - Policy / Spend / Approval / Workflow Protections (2026)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # daily

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  workflow-execution-protections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workflow permissions
        run: |
          echo "Checking workflow execution protections..."
          echo " - Separate code contribution from CI execution (2026 feature)"
          echo " - Only approved actors can run workflows on PRs from forks"
          node scripts/supply-chain/workflow-protection-check.js

  spend-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check MAX_SPEND policy
        run: |
          echo "Verifying zero-cost policy..."
          grep -q "MAX_SPEND=0" .env.example || (echo "MAX_SPEND must be 0 in .env.example" && exit 1)
          echo "MAX_SPEND=0 verified"
      - name: Check no secrets in code
        run: |
          ! grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.ts" --include="*.js" packages/ apps/ services/ || (echo "Potential secret found" && exit 1)
          echo "No secrets detected"

  approval-policy:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check if high-spend mission requires approval
        run: node scripts/verification/check-approval.js --pr ${{ github.event.pull_request.number }}

  adr-rfc-compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADR exists for architectural changes
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "packages/runtime\|packages/governance\|packages/security"; then
            echo "Architectural change detected - checking ADR..."
            ls docs/adr/*.md | wc -l
          fi
      - name: Check RFC for large features
        run: node scripts/verification/check-rfc.js

  codeowners-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate CODEOWNERS syntax
        uses: mszostok/codeowners-validator@v0.7.4
        with:
          checks: "files,duppatterns,syntax"
